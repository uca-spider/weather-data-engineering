version: 2

models:
  - name: stg_weather_cleaned
    description: "Cleaned, typed, and deduplicated weather observations"
    columns:
      - name: observation_id
        description: "Primary key: MD5 hash of city and timestamp"
        tests:
          - unique
          - not_null

      - name: city_name
        description: "Name of the observed city"
        tests:
          - not_null

      - name: observation_timestamp
        description: "Timestamp when the observation was recorded"
        tests:
          - not_null

      - name: temperature
        description: "Current temperature in Celsius"
        tests:
          - not_null

      - name: humidity
        description: "Humidity percentage (0 - 100)"
        tests:
          - not_null
